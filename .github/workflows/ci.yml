name: ci

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog verilator yosys
          pip install -r requirements.txt
      - name: Lint
        run: make lint
      - name: cocotb tests (N = 1..4)
        run: make test-all-n
      - name: Yosys synthesis
        run: make synth
